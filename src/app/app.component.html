<!-- ================= HEADER ================= -->
<div class="app-header">

  <div class="header-row">

    <div class="title-section">
   

      <img *ngIf="theme === 'dark'"
        src="./assets/icons/ChatGPT_Image_Dec_16__2025__10_13_30_AM-removebg-preview.png"
        class="app-logo"
        alt="Acceedo Melt Pro" />

        <img *ngIf="theme === 'light'"
        src="./assets/icons/blacklogo-removebg-preview.png"
        class="app-logo"
        alt="Acceedo Melt Pro" />
    </div>

    <div class="right-section">

      <ng-container
        *ngIf="(selectedPortInfo$ | async) || (selectedIP$ | async); else noneSelected">


        <!-- <div *ngIf="selectedPortInfo$ | async as selPort">
          {{ selPort?.path }}
        </div>

        <div *ngIf="selectedIP$ | async as selIP" class="header-icon">
          <span class="live" >🟢</span>
          {{ formatIPForDisplay(selIP) }}
        </div> -->


        <div *ngIf="(selectedIP$ | async) as selIP; else serial">
  <span class="live">🟢</span>
  {{ formatIPForDisplay(selIP) }}
</div>

<ng-template #serial>
  <div *ngIf="selectedPortInfo$ | async as selPort">
    {{ selPort?.path }}
  </div>
</ng-template>




      </ng-container>

      <ng-template #noneSelected>
        <img src="./assets/icons/offline.png" alt="Help" class="notification-icon  offline" >

        <div class="usage-none">No Serial or IP Selected</div>
      </ng-template>

      <img
        src="./assets/icons/notification-bell.png"
        class="notification-icon" (click)="toggleNotificationPopup()" />

    </div>
  </div>
</div>


<!-- ================= BODY ================= -->
<mat-sidenav-container class="body-container">

  <!-- SIDENAV -->
  <mat-sidenav
    mode="side"
    opened
    class="side-nav">



    <div
  class="nav-item"
  routerLink="/home"
  routerLinkActive="active"
  [routerLinkActiveOptions]="{ exact: true }">

  <img src="./assets/icons/home-button.png" />
  <span class="nav-text">Home</span>
</div>

<div
  class="nav-item"
  routerLink="/settings"
  routerLinkActive="active">

  <img src="./assets/icons/settings.png" />
  <span class="nav-text">Settings</span>
</div>

<div
  class="nav-item"
  routerLink="/calendar"
  routerLinkActive="active">

  <img src="./assets/icons/calendar.png" />
  <span class="nav-text">Calendar</span>
</div>


  </mat-sidenav>

  <!-- CONTENT -->
  <mat-sidenav-content>
    <div class="container">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>

</mat-sidenav-container>




<div
  class="notification-popup"
  *ngIf="showNotificationPopup"
  (clickOutside)="closeNotificationPopup()">

  <h4>Status Summary</h4>

  <ng-container *ngIf="fileStatusCount$ | async as status">
    <div class="status-row sent">
      <span>Sent</span>
      <span>{{ status.sent }}</span>
    </div>

    <div class="status-row no-response">
      <span>No Response</span>
      <span>{{ status.noResponse }}</span>
    </div>

    <div class="status-row no-wifi">
      <span>No WiFi</span>
      <span>{{ status.noWifi }}</span>
    </div>
  </ng-container>

</div>
